<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rozet Odası – Steam Stili Oyun Kütüphanesi & Oyun Profilin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Wide Collection of Custom Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,700;1,700&family=Nunito+Sans:wght@400;600;700;800&family=Press+Start+2P&family=Orbitron:wght@600;800;900&family=Cinzel:wght@700&family=Monoton&family=Bungee&family=Creepster&family=Lobster&family=Pacifico&family=Audiowide&family=VT323&family=Russo+One&family=Bebas+Neue&family=Permanent+Marker&family=Fascinate&family=Luckiest+Guy&family=Righteous&family=Fredoka+One&family=Bangers&family=Black+Ops+One&family=Special+Elite&family=Metamorphous&display=swap" rel="stylesheet">
<style>
:root {
  --navy-900: #080a22; 
  --navy-800: #0d1033; 
  --navy-700: #151a4a; 
  --navy-600: #1f2563;
  --purple: #8b4dff; 
  --purple-d: #5b2bd6; 
  --orange: #ff8a1f; 
  --orange-d: #e56a00;
  --text: #eef0ff; 
  --muted: #9aa0d6; 
  --line: rgba(139, 77, 255, 0.28);
  --head: 'Chakra Petch', 'Trebuchet MS', sans-serif; 
  --body: 'Nunito Sans', 'Segoe UI', sans-serif;
  --steam-dark: #1b2838;
  --steam-card-bg: #101822;
  --steam-blue: #66c0f4;
  --steam-accent: #2a475e;
  --riot-red: #d53b47;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--body);
  background: #06081a;
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
  background-image: 
    radial-gradient(1200px 700px at 85% -10%, rgba(139, 77, 255, 0.28), transparent 65%),
    radial-gradient(900px 600px at -5% 110%, rgba(0, 229, 255, 0.18), transparent 65%),
    linear-gradient(160deg, #06081a 0%, #0c0f33 50%, #15103a 100%);
  background-attachment: fixed;
}

/* Dynamic Level Border Classes for User Banner & Avatars */
.lvl-border-1 { border-color: rgba(255,255,255,0.2) !important; }
.lvl-border-5 { border-color: #00e5ff !important; box-shadow: 0 0 15px rgba(0, 229, 255, 0.4); }
.lvl-border-10 { border-color: #ff2a2a !important; box-shadow: 0 0 18px rgba(255, 42, 42, 0.5); }
.lvl-border-15 { border-color: #39ff14 !important; box-shadow: 0 0 20px rgba(57, 255, 20, 0.5); }
.lvl-border-20 { border-color: #ff2a2a !important; box-shadow: 0 0 22px rgba(255, 42, 42, 0.6); }
.lvl-border-25 { border-color: #39ff14 !important; box-shadow: 0 0 25px rgba(57, 255, 20, 0.6); }
.lvl-border-100 { 
  border-color: #ff8a1f !important; 
  box-shadow: 0 0 35px #ff8a1f, inset 0 0 15px rgba(255, 138, 31, 0.5) !important; 
  animation: pulseOrange 2s infinite alternate;
}

@keyframes pulseOrange {
  from { filter: drop-shadow(0 0 10px #ff8a1f); }
  to { filter: drop-shadow(0 0 25px #ff8a1f); }
}

/* Dynamic Theme BG overrides for Iconic Story Games */
.bg-re { background: linear-gradient(135deg, #100202, #3b0606 50%, #8b0000 100%) !important; }
.bg-hogwarts { background: linear-gradient(135deg, #091726, #1b382b 50%, #3e2808 100%) !important; }
.bg-forest { background: linear-gradient(135deg, #07150b, #19381f 50%, #0d2212 100%) !important; }
.bg-gow { background: linear-gradient(135deg, #170d06, #3d1b06 50%, #0f2b38 100%) !important; }
.bg-valorant { background: #ff4655 !important; }
.bg-cyberpunk { background: linear-gradient(135deg, #1f1b00, #423c00 50%, #fcee0a 100%) !important; }

h1, h2, h3, h4 { font-family: var(--head); letter-spacing: 0.3px; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }

.wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px 80px; }

/* Navigation Bar */
.top {
  position: sticky; top: 0; z-index: 40;
  background: rgba(8, 10, 34, 0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}
.top .wrap { display: flex; align-items: center; gap: 12px; padding: 12px 20px; flex-wrap: wrap; }
.logo {
  font-family: var(--head); font-weight: 700; font-size: 1.3rem;
  color: var(--orange); cursor: pointer; margin-right: auto;
  display: flex; align-items: center; gap: 10px;
  text-shadow: 0 0 12px rgba(255,138,31,0.4);
}
.logo i {
  display: inline-block; width: 14px; height: 14px;
  background: var(--purple); transform: rotate(45deg);
  box-shadow: 0 0 10px var(--purple);
}
.nav-btn {
  background: none; border: 0; color: var(--muted);
  padding: 8px 12px; cursor: pointer; border-radius: 8px; font-weight: 700;
  transition: all 0.2s ease;
}
.nav-btn:hover, .nav-btn.on { color: var(--text); background: var(--navy-700); }

/* Bright Colored Nav Blocks */
.nav-box-green {
  background: linear-gradient(135deg, #2e7d32, #1b5e20) !important;
  color: #fff !important;
  border: 1px solid #4caf50 !important;
  box-shadow: 0 0 10px rgba(76, 175, 80, 0.4);
}
.nav-box-yellow {
  background: linear-gradient(135deg, #f57f17, #f50057) !important;
  color: #fff !important;
  border: 1px solid #ff1744 !important;
  box-shadow: 0 0 10px rgba(255, 23, 68, 0.4);
}
.nav-box-orange {
  background: linear-gradient(135deg, #e65100, #ff8f00) !important;
  color: #fff !important;
  border: 1px solid #ffb300 !important;
  box-shadow: 0 0 10px rgba(255, 179, 0, 0.4);
}

/* Common Buttons & Inputs */
.btn {
  border: 0; cursor: pointer; font-weight: 700; border-radius: 10px;
  padding: 10px 20px; transition: transform 0.15s, filter 0.15s, box-shadow 0.15s;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn:active { transform: scale(0.97); }
.btn-or {
  background: linear-gradient(180deg, var(--orange), var(--orange-d));
  color: #1a0d00; box-shadow: 0 4px 14px rgba(255, 138, 31, 0.35);
}
.btn-or:hover { filter: brightness(1.1); box-shadow: 0 6px 20px rgba(255, 138, 31, 0.5); }
.btn-purple {
  background: linear-gradient(180deg, var(--purple), var(--purple-d));
  color: #fff; box-shadow: 0 4px 14px rgba(139, 77, 255, 0.35);
}
.btn-purple:hover { filter: brightness(1.15); }
.btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.btn-ghost:hover { color: var(--text); border-color: var(--purple); background: rgba(139,77,255,0.1); }
.btn-sm { padding: 6px 12px; font-size: 0.85rem; border-radius: 8px; }

input, select {
  background: var(--navy-800); border: 1px solid var(--line);
  border-radius: 10px; padding: 11px 14px; width: 100%;
}
input:focus, select:focus { border-color: var(--orange); outline: none; box-shadow: 0 0 10px rgba(255,138,31,0.25); }
label { display: block; font-size: 0.85rem; color: var(--muted); margin: 12px 0 6px; font-weight: 600; }
.card { background: linear-gradient(180deg, var(--navy-700), var(--navy-800)); border: 1px solid var(--line); border-radius: 16px; padding: 22px; }
.err { color: #ff6b6b; font-size: 0.88rem; min-height: 1.3em; margin-top: 10px; font-weight: 600; }
.muted { color: var(--muted); }

/* Hero Auth Section */
.hero { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 40px; align-items: center; padding: 50px 0 20px; }
.hero h1 { font-size: clamp(2.2rem, 5vw, 3.6rem); line-height: 1.08; font-weight: 800; }
.hero h1 b { color: var(--orange); text-shadow: 0 0 15px rgba(255,138,31,0.4); }
.hero p { margin-top: 18px; color: var(--muted); max-width: 46ch; font-size: 1.05rem; }
.tabs { display: flex; gap: 8px; margin-bottom: 12px; }
.tab { flex: 1; padding: 11px; border: 0; background: var(--navy-800); color: var(--muted); border-radius: 10px; cursor: pointer; font-weight: 700; }
.tab.on { background: var(--purple-d); color: #fff; box-shadow: 0 4px 12px rgba(91,43,214,0.4); }
.demo-badges { display: flex; gap: 10px; margin-top: 26px; flex-wrap: wrap; }

/* Badges System */
.badge {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px 5px 8px;
  border-radius: 999px; font-size: 0.8rem; font-weight: 700; border: 1px solid rgba(255,255,255,0.15);
  backdrop-filter: blur(4px);
}
.badge s { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; text-decoration: none; font-size: 0.72rem; color: #1a0d00; font-weight: 800; }
.t1 { background: rgba(255,138,31,0.15); border-color: rgba(255,138,31,0.4); } .t1 s { background: var(--orange); }
.t2 { background: rgba(139,77,255,0.2); border-color: rgba(139,77,255,0.5); } .t2 s { background: var(--purple); color: #fff; }
.t3 { background: rgba(111,208,255,0.18); border-color: rgba(111,208,255,0.4); } .t3 s { background: #6fd0ff; }
.t4 { background: rgba(255,215,90,0.22); border-color: rgba(255,215,90,0.5); } .t4 s { background: #ffd75a; }
.t5 { background: rgba(57,255,20,0.2); border-color: #39ff14; } .t5 s { background: #39ff14; color: #000; }
.t6 { background: rgba(255,0,127,0.22); border-color: #ff007f; } .t6 s { background: #ff007f; color: #fff; }
.t7 { background: rgba(0,240,255,0.25); border-color: #00f0ff; } .t7 s { background: #00f0ff; color: #000; }
.t8 { background: rgba(255,85,0,0.28); border-color: #ff5500; } .t8 s { background: #ff5500; color: #fff; }
.t9 { background: rgba(177,85,255,0.3); border-color: #b155ff; } .t9 s { background: #b155ff; color: #fff; }
.t10 { background: rgba(255,215,0,0.35); border-color: #ffd700; box-shadow: 0 0 10px rgba(255,215,0,0.5); } .t10 s { background: linear-gradient(135deg, #fff, #ffd700); color: #000; }

/* Daily Login Modal Cards */
.streak-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; margin-top: 16px; }
.streak-card {
  background: var(--navy-800); border: 1px solid var(--line); border-radius: 12px; padding: 12px 8px;
  text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; position: relative;
}
.streak-card.done { border-color: #39ff14; background: rgba(57,255,20,0.08); }
.streak-card.active { border-color: var(--orange); background: rgba(255,138,31,0.18); box-shadow: 0 0 12px rgba(255,138,31,0.4); }
.streak-card.mega { border-color: #ffd75a; background: linear-gradient(135deg, rgba(255,215,90,0.2), var(--navy-800)); }
.streak-day-title { font-family: var(--head); font-size: 0.85rem; font-weight: 800; color: #fff; }
.streak-reward-xp { font-size: 0.8rem; font-weight: 700; color: var(--orange); }
.streak-reward-one { font-size: 0.75rem; font-weight: 700; color: #ffd75a; }
.sh-triangle { clip-path: polygon(50% 2%, 98% 96%, 2% 96%); }
.sh-hexagon { clip-path: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0 50%); }
.sh-diamond { clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
.sh-shield { clip-path: polygon(0 0, 100% 0, 100% 58%, 50% 100%, 0 58%); }
.sh-octagon { clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%); }
.avatar.sh-triangle { padding-top: 28%; }
.avatar.sh-shield { padding-bottom: 12%; }

.fc-orange { --fb: var(--orange); --glow: rgba(255,138,31,.75); }
.fc-purple { --fb: var(--purple); --glow: rgba(139,77,255,.85); }
.fc-duo { --fb: conic-gradient(var(--orange), var(--purple), var(--orange)); --glow: rgba(190,100,200,.6); }
.fc-gold { --fb: linear-gradient(135deg, #fff1b8, #ffc933 50%, #c98a00); --glow: rgba(255,215,90,.7); }
.fc-ice { --fb: linear-gradient(135deg, #d8f4ff, #6fd0ff); --glow: rgba(111,208,255,.7); }
.fc-neon { --fb: conic-gradient(#ff007f, #00f0ff, #7f00ff, #ff007f); --glow: rgba(0,240,255,.8); }
.fc-rgb { --fb: conic-gradient(#ff2a2a, #ffb000, #33ff33, #00e5ff, #2a4bff, #d500ff, #ff2a2a); --glow: rgba(255,255,255,.35); }
.fc-rgb .frame::before { animation: hue 3s linear infinite; }
@keyframes hue { to { filter: hue-rotate(360deg); } }

/* User Banner & Profile Header */
.pbanner {
  border-radius: 20px; padding: 30px; display: flex; gap: 28px; align-items: center;
  flex-wrap: wrap; margin-top: 26px; border: 1px solid var(--line);
  box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; overflow: hidden;
}
.pinfo { flex: 1; min-width: 240px; text-shadow: 0 2px 10px rgba(0,0,0,0.7); z-index: 2; }
.pinfo h2 { font-size: 2.2rem; line-height: 1.1; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.pstats { display: flex; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
.chip {
  background: rgba(8, 10, 34, 0.72); border: 1px solid rgba(255,255,255,0.18);
  border-radius: 12px; padding: 8px 14px; text-shadow: none; backdrop-filter: blur(6px);
}
.chip b { font-family: var(--head); font-size: 1.3rem; color: var(--orange); display: block; line-height: 1.1; }
.chip span { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

.lvl { margin-top: 14px; max-width: 380px; }
.lvl small { display: flex; justify-content: space-between; color: #fff; opacity: 0.95; font-size: 0.82rem; text-shadow: none; font-weight: 700; }
.bar { height: 10px; border-radius: 99px; background: rgba(8, 10, 34, 0.65); margin-top: 6px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--orange), #ffd08a); border-radius: 99px; transition: width 0.5s ease; }

/* Customization Panel / Market Section */
.panel { margin-top: 20px; display: grid; gap: 20px; border-color: var(--purple); }
.panel-head { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.panel-head h3 { color: var(--orange); font-size: 1.25rem; }
.store-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; max-height: 280px; overflow-y: auto; padding: 6px; border-radius: 10px; background: rgba(0,0,0,0.2); }
.store-item {
  background: var(--navy-800); border: 1px solid var(--line); border-radius: 10px; padding: 10px;
  cursor: pointer; text-align: center; transition: all 0.2s; position: relative; font-size: 0.85rem;
}
.store-item:hover { border-color: var(--orange); transform: translateY(-2px); }
.store-item.on { border-color: var(--orange); background: rgba(255,138,31,0.18); box-shadow: 0 0 10px rgba(255,138,31,0.3); }
.store-item.locked { opacity: 0.5; cursor: not-allowed; filter: grayscale(0.8); }
.store-item.locked:hover { transform: none; border-color: var(--line); }
.lock-tag { font-size: 0.7rem; color: var(--orange); font-weight: 800; display: block; margin-top: 4px; }

/* STEAM GRID LIBRARY UI */
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 36px 0 16px; flex-wrap: wrap; }
.sec-h h3 { font-size: 1.45rem; display: flex; align-items: center; gap: 10px; }
.steam-badge-tag { background: var(--steam-accent); color: var(--steam-blue); padding: 3px 10px; border-radius: 6px; font-size: 0.78rem; font-weight: 800; text-transform: uppercase; }

.steam-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
  gap: 20px;
}
.steam-card {
  background: var(--steam-card-bg);
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.1);
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  position: relative;
}
.steam-card:hover {
  transform: translateY(-6px) scale(1.02);
  box-shadow: 0 14px 30px rgba(0,0,0,0.7), 0 0 15px rgba(139,77,255,0.3);
  border-color: var(--orange);
}
.poster-wrap {
  position: relative;
  aspect-ratio: 2/3;
  width: 100%;
  overflow: hidden;
  background: #000;
  display: grid;
  place-items: center;
}
.poster-wrap img {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
  transition: transform 0.3s ease;
}
.steam-card:hover .poster-wrap img { transform: scale(1.05); }
.poster-fallback {
  width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
  padding: 16px; text-align: center; font-family: var(--head); font-weight: 800;
  font-size: 1.2rem; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.8);
}
.platform-pill {
  position: absolute; top: 10px; left: 10px; z-index: 5;
  width: 28px; height: 28px; border-radius: 8px; overflow: hidden;
  box-shadow: 0 4px 10px rgba(0,0,0,0.7); background: rgba(0,0,0,0.65);
  backdrop-filter: blur(4px); padding: 3px; display: flex; align-items: center; justify-content: center;
}
.platform-pill svg { width: 100%; height: 100%; display: block; }
.badge-count-pill {
  position: absolute; bottom: 10px; right: 10px; z-index: 5;
  background: rgba(8, 10, 34, 0.88); border: 1px solid var(--orange);
  color: var(--orange); border-radius: 8px; padding: 2px 8px; font-weight: 800; font-size: 0.75rem;
  box-shadow: 0 2px 8px rgba(0,0,0,0.6);
}
.card-meta {
  padding: 12px; background: linear-gradient(180deg, rgba(21,26,74,0.9), var(--navy-800));
  display: flex; flex-direction: column; gap: 4px; border-top: 1px solid rgba(255,255,255,0.05);
}
.card-title {
  font-weight: 700; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff;
}
.card-hours {
  font-family: var(--head); color: var(--orange); font-size: 0.9rem; font-weight: 700; display: flex; align-items: center; justify-content: space-between;
}

/* Achievements */
.ach { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.at {
  background: var(--navy-800); border: 1px solid var(--line); border-radius: 14px; padding: 14px;
  display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: center;
}
.at .ic { font-size: 1.8rem; width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; background: var(--navy-600); grid-row: span 2; }
.at.done { border-color: var(--orange); background: linear-gradient(135deg, rgba(255,138,31,0.15), var(--navy-800)); }
.at.done .ic { background: linear-gradient(135deg, var(--orange), var(--purple-d)); }
.at:not(.done) .ic { filter: grayscale(1); opacity: 0.5; }
.at b { font-family: var(--head); font-size: 0.98rem; line-height: 1.15; }
.at small { color: var(--muted); font-size: 0.78rem; line-height: 1.25; }
.at .bar { grid-column: 1/-1; margin-top: 6px; background: var(--navy-600); }
.at .bp { grid-column: 1/-1; font-size: 0.75rem; color: var(--muted); display: flex; justify-content: space-between; }
.at.done .bp { color: var(--orange); font-weight: 700; }

/* Leaderboard */
.lb { display: grid; gap: 10px; }
.lbrow {
  display: flex; align-items: center; gap: 16px; padding: 12px 18px; background: var(--navy-800);
  border: 1px solid var(--line); border-radius: 14px; cursor: pointer; transition: all 0.2s ease;
}
.lbrow:hover { border-color: var(--orange); transform: translateX(4px); background: var(--navy-700); }
.rank { font-family: var(--head); font-weight: 800; width: 32px; font-size: 1.1rem; color: var(--muted); }
.lbrow:nth-child(1) .rank { color: #ffd75a; font-size: 1.3rem; }
.lbrow:nth-child(2) .rank { color: #cfd6ff; font-size: 1.2rem; }
.lbrow:nth-child(3) .rank { color: #ff9d5c; font-size: 1.15rem; }
.lbname { flex: 1; font-weight: 700; font-size: 1.05rem; }
.lbpts { font-family: var(--head); color: var(--orange); font-weight: 800; font-size: 1.15rem; }

/* Modals & Toasts */
.modal { position: fixed; inset: 0; background: rgba(4, 5, 20, 0.82); backdrop-filter: blur(8px); display: none; place-items: center; z-index: 100; padding: 18px; }
.modal.open { display: grid; }
.modal .card { width: 100%; max-width: 480px; max-height: 92vh; overflow: auto; border-color: var(--purple); box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
.mhead { display: flex; gap: 18px; align-items: flex-start; }
.mhead .poster-wrap { width: 105px; flex: none; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,0.5); }

.lockbox {
  margin-top: 14px; padding: 12px 14px; border-radius: 12px; border: 1px dashed var(--line);
  font-size: 0.88rem; color: var(--muted); background: rgba(0,0,0,0.2);
}
.lockbox b { color: var(--orange); }

.toast {

async function hash(pw, salt) {
  const data = salt + ':' + pw;
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(data));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  } catch (e) {
    let h = 5381; for (let i = 0; i < data.length; i++) h = ((h << 5) + h + data.charCodeAt(i)) >>> 0;
    return 'x' + h.toString(16);
  }
}

function checkDailyLogin(u, manualClaim = false) {
  const now = Date.now();
  const last = u.lastLogin || 0;
  const diff = now - last;

  const canClaim = diff >= 20 * 3600 * 1000 || last === 0;

  if (manualClaim) {
    if (!canClaim) {
      const remainingMs = (20 * 3600 * 1000) - diff;
      toast(`Bugünün ödülünü zaten aldın! Bir sonraki ödül: ${leftText(remainingMs)} sonra.`);
      return;
    }
    
    if (last > 0 && diff <= 48 * 3600 * 1000) {
      u.loginStreak = (u.loginStreak || 0) + 1;
    } else {
      u.loginStreak = 1;
    }

    u.lastLogin = now;
    
    if (u.loginStreak % 7 === 0) {
      u.bonusExp = (u.bonusExp || 0) + 2000;
      u.onePoints = (u.onePoints || 0) + 200;

  if (dailyBtn) dailyBtn.onclick = () => openDailyLoginModal(u);
}

function openDailyLoginModal(u) {
  const now = Date.now();
  const last = u.lastLogin || 0;
  const diff = now - last;
  const canClaim = diff >= 20 * 3600 * 1000 || last === 0;
  const streak = u.loginStreak || 0;
  const currentDayIndex = streak % 7; 

  const daysConfig = [
    { day: 1, xp: 500, one: 10 },
    { day: 2, xp: 500, one: 10 },
    { day: 3, xp: 600, one: 15 },
    { day: 4, xp: 600, one: 15 },
    { day: 5, xp: 750, one: 20 },
    { day: 6, xp: 800, one: 25 },
    { day: 7, xp: 2000, one: 200, mega: true }
  ];

  let remainingText = '';
  if (!canClaim) {
    const remMs = (20 * 3600 * 1000) - diff;
    remainingText = leftText(remMs);
  }

  openModal(`
    <h3 style="font-size:1.35rem;color:var(--orange);margin-bottom:6px">📅 Günlük Giriş Takvimi</h3>
    <p style="font-size:0.88rem;color:var(--muted)">Her gün giriş yap ve seriyi bozmadan ödülleri topla! 7. günde <b>2.000 XP (Tam 1 Level!)</b> kazan.</p>
    
    <div class="streak-grid">
      ${daysConfig.map(d => {
        let statusClass = '';
        let statusLabel = '🔒 Kilitli';
        
        if (canClaim) {
          if (d.day === currentDayIndex + 1) {
            statusClass = 'active';
            statusLabel = '✨ ALINABİLİR';
          } else if (d.day <= currentDayIndex) {
            statusClass = 'done';
            statusLabel = '✓ Alındı';
          }
        } else {
          if (d.day <= currentDayIndex) {
            statusClass = 'done';
            statusLabel = '✓ Alındı';
          } else if (d.day === currentDayIndex + 1) {
            statusClass = 'active';
            statusLabel = '⏳ Bekleniyor';
          }
        }

        return `
        <div class="streak-card ${statusClass} ${d.mega ? 'mega' : ''}">
          <div class="streak-day-title">${d.day}. GÜN</div>
          <div style="font-size:1.4rem">${d.mega ? '👑' : '🎁'}</div>
          <div class="streak-reward-xp">+${d.xp} XP</div>
          <div class="streak-reward-one">+${d.one} One</div>
          <div style="font-size:0.7rem;font-weight:bold;margin-top:4px">${statusLabel}</div>
        </div>`;
      }).join('')}
    </div>

    ${!canClaim ? `
      <div class="lockbox" style="text-align:center;margin-top:16px">
        ⏳ Bir sonraki günlük ödülün açılmasına kalan süre: <b style="color:var(--orange)">${remainingText}</b>
      </div>
    ` : `
      <button class="btn btn-or" id="claimDailyBtn" style="width:100%;margin-top:16px;padding:12px">🎁 Bugünkü Ödülü Al</button>
    `}
    <button class="btn btn-ghost" id="closeDailyModal" style="width:100%;margin-top:8px">Kapat</button>
  `);

  const claimBtn = $('#claimDailyBtn');
  if (claimBtn) {
    claimBtn.onclick = () => {
      checkDailyLogin(u, true);
      closeModal();
    };
  }
  $('#closeDailyModal').onclick = closeModal;
}

$('#nav').addEventListener('click', e => {

  if (g === 'me') view = { page: 'home', user: me, customTab: 'fonts' };

function render() {
  renderNav(); const a = $('#app');
  if (!me) { a.innerHTML = authHTML(); bindAuth(); return; }
  if (view.page === 'lb') { a.innerHTML = lbHTML(); bindLb(); return; }
  if (view.page === 'badges') { a.innerHTML = badgesPageHTML(); return; }

function bindAuth() {
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => { authTab = b.dataset.t; render(); });
  const go = async () => {
    const name = $('#un').value.trim(), pw = $('#pw').value, key = name.toLowerCase(), err = $('#err');
    if (!/^[\p{L}\p{N}_.-]{3,20}$/u.test(name)) { err.textContent = 'Kullanıcı adı 3-20 karakter olmalıdır.'; return; }
    if (authTab === 'reg') {
      if (db.users[key]) { err.textContent = 'Bu kullanıcı adı zaten alınmış.'; return; }
      if (pw.length < 4) { err.textContent = 'Şifre en az 4 karakter olmalıdır.'; return; }
      if (pw !== $('#pw2').value) { err.textContent = 'Şifreler uyuşmuyor.'; return; }
      const salt = newSalt();
      db.users[key] = {
        name, salt, hash: await hash(pw, salt), shape: 'circle', fcolor: 'orange', bg: 'sunset',
        avatarUrl: '', fontStyle: 'default', nameColor: 'default', games: [], removed: {},
        created: Date.now(), onePoints: 0, oneInventory: [], loginStreak: 0, lastLogin: 0, bonusExp: 0
      };
      save(); me = key; localStorage.setItem(SESS, me); view = { page: 'home', user: me, customTab: 'fonts' }; toast('Hoş geldin, ' + name + '!'); render();
    } else {
      const u = db.users[key];
      if (!u || u.hash !== await hash(pw, u.salt)) { err.textContent = 'Kullanıcı adı veya şifre hatalı.'; return; }
      me = key; localStorage.setItem(SESS, me); view = { page: 'home', user: me, customTab: 'fonts' }; render();
    }
  };
  $('#go').onclick = go;
  document.querySelectorAll('#app input').forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') go(); }));
}

function bindProfile(key, own) {
  const u = db.users[key];
  const back = $('#back'); if (back) back.onclick = () => { view = { page: 'lb' }; render(); };
  document.querySelectorAll('.steam-card').forEach(b => b.onclick = () => openGame(key, b.dataset.g, own));
  if (!own) return;

  const customBtn = $('#custom');
  if (customBtn) customBtn.onclick = () => { view.custom = !view.custom; render(); };

  document.querySelectorAll('[data-ctab]').forEach(b => b.onclick = () => { view.customTab = b.dataset.ctab; render(); });

  const saveAvatarBtn = $('#saveAvatarBtn');
  if (saveAvatarBtn) {
    saveAvatarBtn.onclick = () => {
      const urlInput = $('#avatarUrlInput');
      if (urlInput) {
        u.avatarUrl = urlInput.value.trim();
        save(); render(); toast('Profil fotoğrafı güncellendi!');
      }
    };
  }

  const avatarFileInput = $('#avatarFileInput');
  if (avatarFileInput) {
    avatarFileInput.onchange = e => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = ev => {
          u.avatarUrl = ev.target.result;
          save(); render(); toast('Profil fotoğrafı yüklendi!');
        };
        reader.readAsDataURL(file);
      }
    };
  }

  const removeAvatarBtn = $('#removeAvatarBtn');
  if (removeAvatarBtn) {
    removeAvatarBtn.onclick = () => {
      u.avatarUrl = '';
      save(); render(); toast('Profil fotoğrafı kaldırıldı!');
    };
  }

  document.querySelectorAll('[data-font]').forEach(b => b.onclick = () => {
    const f = STORE_FONTS.find(x => x.id === b.dataset.font);
    if (f && uPoints(u) >= f.reqPts) { u.fontStyle = f.id; save(); render(); }
  });

  document.querySelectorAll('[data-ncol]').forEach(b => b.onclick = () => {
    const c = STORE_NAME_COLORS.find(x => x.id === b.dataset.ncol);
    if (c && uPoints(u) >= c.reqPts) { u.nameColor = c.id; save(); render(); }
  });

  document.querySelectorAll('[data-shape]').forEach(b => b.onclick = () => {
    const idx = SHAPES.findIndex(s => s[0] === b.dataset.shape);
    if (idx !== -1 && uPoints(u) >= idx * 1000) { u.shape = b.dataset.shape; save(); render(); }
  });

  document.querySelectorAll('[data-bg]').forEach(b => b.onclick = () => {
    const idx = BGS.findIndex(s => s[0] === b.dataset.bg);
    if (idx !== -1 && uPoints(u) >= idx * 5000) { u.bg = b.dataset.bg; save(); render(); }
  });

  const addBtn = $('#add');
  if (addBtn) addBtn.onclick = () => openAdd(u);
}

function bindOneMarket() {
  document.querySelectorAll('[data-buy-one]').forEach(b => b.onclick = () => {
    const u = db.users[me];
    const itemId = b.dataset.buyOne;
    const item = ONE_MARKET_ITEMS.find(x => x.id === itemId);
    if (!item) return;

    if ((u.onePoints || 0) < item.cost) {
      toast('Yeterli One Puanın yok!'); return;
    }

    u.onePoints -= item.cost;
    u.oneInventory = u.oneInventory || [];
    u.oneInventory.push(itemId);
    save(); render(); toast(`${item.name} başarıyla satın alındı!`);
  });
}

  openModal(`<h3 style="font-size:1.3rem;margin-bottom:12px">Kütüphaneye Oyun Ekle</h3>
    <label for="gsel">Oyun Seç</label>
    <select id="gsel"><option value="">Popüler listeden seçin...</option>${PRESETS.map(p => `<option>${esc(p)}</option>`).join('')}<option value="__c">+ Listede Yok (Elle Yaz)</option></select>
    <input id="gcustom" placeholder="Oyun Adı" maxlength="40" style="display:none;margin-top:8px">
    <label>Platform / İstemci</label>
    <div class="opt-row" id="plats">
      <button class="btn btn-ghost btn-sm on" data-p="steam" style="background:#1b2838;color:#fff">${STEAM_SVG} Steam</button>
      <button class="btn btn-ghost btn-sm" data-p="epic" style="background:#2b2b2f;color:#fff">${EPIC_SVG} Epic Games</button>
      <button class="btn btn-ghost btn-sm" data-p="riot" style="background:#d53b47;color:#fff">${RIOT_SVG} Riot Games</button>
    </div>
    <label for="ghours">Oynama Süresi (Saat)</label>
    <input id="ghours" type="number" min="0" max="99999" step="0.5" placeholder="Örn. 120">
    <div class="lockbox">Eklendiği andan itibaren oynama süresi <b>7 gün</b> kilitlenir.</div>
    <div class="err" id="merr"></div>
    <div style="display:flex;gap:10px;margin-top:16px"><button class="btn btn-or" id="gsave" style="flex:1">Kütüphaneye Ekle</button><button class="btn btn-ghost" id="gcancel">İptal</button></div>`);
  
  let plat = 'steam';
  $('#gsel').onchange = e => { $('#gcustom').style.display = e.target.value === '__c' ? 'block' : 'none'; };
  document.querySelectorAll('#plats button').forEach(b => b.onclick = () => {
    plat = b.dataset.p;
    document.querySelectorAll('#plats button').forEach(x => x.classList.toggle('on', x === b));
  });
  $('#gcancel').onclick = closeModal;
  $('#gsave').onclick = () => {
    let name = $('#gsel').value; if (name === '__c') name = $('#gcustom').value.trim();
    const hrs = parseFloat($('#ghours').value), err = $('#merr');
    if (!name) { err.textContent = 'Lütfen bir oyun seçin veya adını yazın.'; return; }
    if (isNaN(hrs) || hrs < 0) { err.textContent = 'Geçerli bir oynama süresi girin.'; return; }
    if (u.games.some(g => g.name.toLowerCase() === name.toLowerCase() && g.platform === plat)) { err.textContent = 'Bu oyunu bu platformda zaten eklemişsiniz.'; return; }
    const rk = name.toLowerCase() + '|' + plat, rm = u.removed[rk];
    if (rm && rm + WEEK > Date.now()) { err.textContent = `Bu oyunu yakın zamanda sildiniz. ${leftText(rm + WEEK - Date.now())} sonra tekrar ekleyebilirsiniz.`; return; }
    const b = snap(u);
    u.games.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), name, platform: plat, hours: hrs, lastEdit: Date.now() });
    delete u.removed[rk];
    save(); closeModal(); render(); gainMsg(u, b, `${name} eklendi!`);
  };
}

function openGame(key, id, own) {
  const u = db.users[key], g = u.games.find(x => x.id === id); if (!g) return;
  const n = gBadges(g), left = STEP - ((+g.hours) % STEP), wait = editWait(g);
  const show = n > 14 ? [...Array(14)].map((_, i) => n - 13 + i) : [...Array(n)].map((_, i) => i + 1);
  let editBox = '';
  if (own) {
    editBox = wait > 0
      ? `<div class="lockbox">Süre kilitli. Güncelleme tarihi: <b>${new Date(g.lastEdit + WEEK).toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' })}</b> (${leftText(wait)} kaldi).</div>`
      : `<label for="ehours">Yeni Toplam Süre (Saat)</label><input id="ehours" type="number" min="${+g.hours}" step="0.5" value="${+g.hours}">
        <div class="lockbox">Kaydedildikten sonra süre <b>7 gün</b> kilitlenecektir.</div>`;
  }
  openModal(`<div class="mhead">${coverHTML(g)}<div style="flex:1;min-width:0">
      <h3 style="font-size:1.3rem;line-height:1.15">${esc(g.name)}</h3>
      <div class="muted" style="font-size:0.88rem;margin-top:4px">${platName(g.platform)}</div>
      <div style="font-family:var(--head);font-size:1.5rem;color:var(--orange);margin-top:6px">${fmt(+g.hours)} Saat</div>
      <div class="muted" style="font-size:0.85rem">${n} Rozet · Toplam +${n * POINT} Puan</div></div></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:14px">${n ? show.map(badgeHTML).join('') : `<span class="muted" style="font-size:0.85rem">İlk rozet için ${STEP} saat gerekiyor.</span>`}</div>
    <div class="bar" style="background:var(--navy-600);margin-top:12px"><i style="width:${((+g.hours % STEP) / STEP) * 100}%"></i></div>
    <div class="muted" style="font-size:0.78rem;margin-top:4px">Sonraki rozete ${fmt(left)} saat kaldı</div>
    ${editBox}
    <div class="err" id="merr"></div>
    <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
      ${own && wait <= 0 ? `<button class="btn btn-or" id="esave" style="flex:1">Kaydet</button>` : ''}
      ${own ? `<button class="btn btn-ghost" id="gdel">Sil</button>` : ''}
      <button class="btn btn-ghost" id="gcancel">Kapat</button></div>`);
  $('#gcancel').onclick = closeModal;
  if (!own) return;
  const es = $('#esave');
  if (es) es.onclick = () => {
    const h = parseFloat($('#ehours').value);
    if (isNaN(h) || h < g.hours) { $('#merr').textContent = 'Süre mevcut değerden az olamaz.'; return; }
    if (h === g.hours) { closeModal(); return; }
    const b = snap(u); g.hours = h; g.lastEdit = Date.now(); save(); closeModal(); render(); gainMsg(u, b, 'Süre güncellendi.');
  };
  const gdel = $('#gdel');
  if (gdel) gdel.onclick = () => {
    if (!confirm(`"${g.name}" silinsin mi? Oyundan kazandığın puan düşülecektir.`)) return;
    u.removed[g.name.toLowerCase() + '|' + g.platform] = Date.now();
    u.games = u.games.filter(x => x !== g); save(); closeModal(); render();
  };
}

/* Leaderboard Page */
function lbHTML() {
  const rows = Object.entries(db.users).map(([k, u]) => ({ k, u, p: uPoints(u) })).sort((a, b) => b.p - a.p);
  return `<div class="sec-h" style="margin-top:34px"><h3>Sıralama ve Oyuncu Profilleri</h3><span class="muted" style="font-size:0.88rem">${rows.length} Oyuncu Kayıtlı</span></div>
  <div class="lb">${rows.map((r, i) => `<div class="lbrow" data-u="${esc(r.k)}">
    <span class="rank">${i + 1}</span>
    ${frameHTML(r.u, 46)}
    <span class="lbname" style="font-family:${getUserFontCSS(r.u)}; ${getUserNameColorCSS(r.u)}">${esc(r.u.name)}${r.k === me ? ' <span class="muted" style="font-size:0.8rem">(Sen)</span>' : ''}</span>
    <span class="muted" style="font-size:0.85rem">${r.u.games.length} Oyun</span>
    <span class="lbpts">${r.p} Puan</span>
  </div>`).join('')}</div>`;
}

function bindLb() {
  document.querySelectorAll('.lbrow').forEach(r => r.onclick = () => {
    view = { page: 'home', user: r.dataset.u, customTab: 'fonts' };
    render(); window.scrollTo(0, 0);
  });
}

render();
</script>
</body>
</html>
